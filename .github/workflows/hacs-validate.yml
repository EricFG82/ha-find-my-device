name: HACS validation

# Runs the checks HACS itself (and its reviewers, for the default store)
# expect to pass. Doesn't publish anything - see release.yml for that.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS recommends a periodic re-check even without changes, since their
    # own validation rules evolve over time.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master
