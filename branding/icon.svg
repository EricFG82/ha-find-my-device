<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Animated variant with pulsing radar waves. Same generic pin + crosshair
       motif as logo.svg - no third-party logo marks. -->
  <defs>
    <linearGradient id="pinGradientAnim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#3B82F6" opacity="0.12"/>

  <!-- Main location pin -->
  <g filter="url(#shadow)">
    <path d="M 128 40
             C 100 40, 78 62, 78 90
             C 78 110, 90 125, 128 180
             C 166 125, 178 110, 178 90
             C 178 62, 156 40, 128 40 Z"
          fill="url(#pinGradientAnim)"
          stroke="#1D4ED8"
          stroke-width="3"/>

    <!-- "You are here" crosshair dot -->
    <circle cx="128" cy="88" r="28" fill="white"/>
    <circle cx="128" cy="88" r="17" fill="none" stroke="#1D4ED8" stroke-width="3.5"/>
    <circle cx="128" cy="88" r="7" fill="#1D4ED8"/>
  </g>

  <!-- Radar/signal waves (indicating "Find My" functionality) -->
  <g opacity="0.6">
    <circle cx="128" cy="88" r="45"
            fill="none"
            stroke="#0EA5B7"
            stroke-width="2"
            stroke-dasharray="5,5"
            opacity="0.5">
      <animate attributeName="r" from="35" to="50" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.5" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>

    <circle cx="128" cy="88" r="40"
            fill="none"
            stroke="#0EA5B7"
            stroke-width="2"
            stroke-dasharray="5,5"
            opacity="0.7">
      <animate attributeName="r" from="35" to="50" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.7" to="0" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </circle>

    <circle cx="128" cy="88" r="35"
            fill="none"
            stroke="#0EA5B7"
            stroke-width="2"
            stroke-dasharray="5,5"
            opacity="0.9">
      <animate attributeName="r" from="35" to="50" dur="2s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.9" to="0" dur="2s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Small device icons around the pin (representing tracked devices) -->
  <g opacity="0.7">
    <!-- Phone icon (left) -->
    <rect x="50" y="140" width="20" height="30" rx="3"
          fill="#64748B" stroke="#334155" stroke-width="1.5"/>
    <rect x="52" y="143" width="16" height="20"
          fill="#E2E8F0"/>
    <circle cx="60" cy="167" r="2" fill="#64748B"/>

    <!-- Tablet icon (right) -->
    <rect x="186" y="135" width="28" height="38" rx="3"
          fill="#64748B" stroke="#334155" stroke-width="1.5"/>
    <rect x="189" y="138" width="22" height="28"
          fill="#E2E8F0"/>
    <circle cx="200" cy="169" r="2" fill="#64748B"/>

    <!-- Tracker/Tag icon (bottom) -->
    <circle cx="128" cy="210" r="12"
            fill="#64748B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="128" cy="210" r="8"
            fill="#E2E8F0"/>
    <circle cx="128" cy="210" r="4"
            fill="#1D4ED8"/>
  </g>
</svg>
