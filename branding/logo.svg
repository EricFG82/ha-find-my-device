<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Simple, clean logo for the integration list - a generic location pin
       with a "you are here" crosshair dot. No third-party logo marks. -->
  <defs>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>

    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="128" cy="128" r="115" fill="#EFF3F8"/>

  <!-- Main location pin -->
  <g filter="url(#dropShadow)">
    <path d="M 128 50
             C 95 50, 68 77, 68 110
             C 68 135, 85 155, 128 210
             C 171 155, 188 135, 188 110
             C 188 77, 161 50, 128 50 Z"
          fill="url(#pinGradient)"/>

    <!-- "You are here" crosshair dot -->
    <circle cx="128" cy="108" r="35" fill="white"/>
    <circle cx="128" cy="108" r="22" fill="none" stroke="#1D4ED8" stroke-width="4"/>
    <circle cx="128" cy="108" r="9" fill="#1D4ED8"/>
  </g>

  <!-- Signal waves (subtle, static) -->
  <g opacity="0.35">
    <circle cx="128" cy="108" r="50"
            fill="none"
            stroke="#0EA5B7"
            stroke-width="2"
            stroke-dasharray="8,8"/>
    <circle cx="128" cy="108" r="60"
            fill="none"
            stroke="#0EA5B7"
            stroke-width="2"
            stroke-dasharray="8,8"
            opacity="0.6"/>
  </g>

  <!-- Small device indicators at bottom -->
  <g opacity="0.55" transform="translate(128, 230)">
    <!-- Phone -->
    <rect x="-35" y="-8" width="12" height="16" rx="2"
          fill="#64748B"/>
    <rect x="-34" y="-7" width="10" height="11"
          fill="#E2E8F0"/>

    <!-- Tablet -->
    <rect x="-6" y="-9" width="16" height="18" rx="2"
          fill="#64748B"/>
    <rect x="-5" y="-8" width="14" height="13"
          fill="#E2E8F0"/>

    <!-- Tracker tag -->
    <circle cx="28" cy="0" r="7" fill="#64748B"/>
    <circle cx="28" cy="0" r="5" fill="#E2E8F0"/>
    <circle cx="28" cy="0" r="3" fill="#1D4ED8"/>
  </g>
</svg>
