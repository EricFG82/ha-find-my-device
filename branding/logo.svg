<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Simple, clean logo for integration list -->
  <defs>
    <linearGradient id="pinGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1967D2;stop-opacity:1" />
    </linearGradient>
    
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with subtle gradient -->
  <circle cx="128" cy="128" r="115" fill="#F1F3F4"/>
  
  <!-- Main location pin -->
  <g filter="url(#dropShadow)">
    <!-- Pin body with gradient -->
    <path d="M 128 50 
             C 95 50, 68 77, 68 110
             C 68 135, 85 155, 128 210
             C 171 155, 188 135, 188 110
             C 188 77, 161 50, 128 50 Z" 
          fill="url(#pinGradient)"/>
    
    <!-- Inner white circle -->
    <circle cx="128" cy="108" r="35" fill="white"/>
    
    <!-- Google "G" logo -->
    <g transform="translate(128, 108)">
      <!-- Blue part (top and right) -->
      <path d="M 0 -20
               C 11 -20, 20 -11, 20 0
               L 20 0
               L 8 0
               L 8 6
               L 14 6
               C 13 11, 7 15, 0 15
               C -8 15, -15 8, -15 0
               C -15 -8, -8 -15, 0 -15
               C 4 -15, 8 -13, 11 -10
               L 16 -15
               C 12 -18, 6 -20, 0 -20 Z"
            fill="#4285F4"/>
      
      <!-- Red part (bottom right) -->
      <path d="M 0 15
               C 7 15, 13 11, 14 6
               L 8 6
               L 8 0
               L 20 0
               C 20 11, 11 20, 0 20
               C -11 20, -20 11, -20 0
               L -15 0
               C -15 8, -8 15, 0 15 Z"
            fill="#EA4335"
            opacity="0"/>
      
      <!-- Yellow part (bottom left) -->
      <path d="M -15 0
               C -15 8, -8 15, 0 15
               L 0 20
               C -11 20, -20 11, -20 0
               L -15 0 Z"
            fill="#FBBC04"
            opacity="0"/>
      
      <!-- Green part (left) -->
      <path d="M -20 0
               C -20 -11, -11 -20, 0 -20
               L 0 -15
               C -8 -15, -15 -8, -15 0
               L -20 0 Z"
            fill="#34A853"
            opacity="0"/>
    </g>
    
    <!-- Simplified Google dot in center -->
    <circle cx="128" cy="108" r="18" fill="#4285F4"/>
    <circle cx="128" cy="108" r="12" fill="white"/>
    <path d="M 128 96
             C 134.6 96, 140 101.4, 140 108
             C 140 114.6, 134.6 120, 128 120
             C 121.4 120, 116 114.6, 116 108
             C 116 101.4, 121.4 96, 128 96
             M 128 100
             C 123.6 100, 120 103.6, 120 108
             C 120 112.4, 123.6 116, 128 116
             C 132.4 116, 136 112.4, 136 108
             L 136 108
             L 130 108
             L 130 111
             L 133 111
             C 132 113, 130 115, 128 115
             C 125 115, 122 112, 122 108
             C 122 104, 125 101, 128 101
             C 130 101, 131 102, 132 103
             L 134 101
             C 132 99, 130 100, 128 100 Z"
          fill="#4285F4"/>
  </g>
  
  <!-- Signal waves (subtle, static) -->
  <g opacity="0.3">
    <circle cx="128" cy="108" r="50" 
            fill="none" 
            stroke="#34A853" 
            stroke-width="2" 
            stroke-dasharray="8,8"/>
    <circle cx="128" cy="108" r="60" 
            fill="none" 
            stroke="#34A853" 
            stroke-width="2" 
            stroke-dasharray="8,8"
            opacity="0.6"/>
  </g>
  
  <!-- Small device indicators at bottom -->
  <g opacity="0.5" transform="translate(128, 230)">
    <!-- Phone -->
    <rect x="-35" y="-8" width="12" height="16" rx="2" 
          fill="#5F6368"/>
    <rect x="-34" y="-7" width="10" height="11" 
          fill="#E8EAED"/>
    
    <!-- Tablet -->
    <rect x="-6" y="-9" width="16" height="18" rx="2" 
          fill="#5F6368"/>
    <rect x="-5" y="-8" width="14" height="13" 
          fill="#E8EAED"/>
    
    <!-- Tracker -->
    <circle cx="28" cy="0" r="7" fill="#5F6368"/>
    <circle cx="28" cy="0" r="5" fill="#E8EAED"/>
    <circle cx="28" cy="0" r="3" fill="#4285F4"/>
  </g>
</svg>

