# Example Home Assistant Configuration
# This file shows example automations, scripts, and dashboard cards
# for the Google Find My Device integration

# Note: The integration itself is configured via UI (Settings > Devices & Services)
# This file contains examples of how to USE the integration in your automations

# ============================================================================
# AUTOMATIONS
# ============================================================================

automation:
  # Low battery alert
  - alias: "Google Find My - Low Battery Alert"
    description: "Alert when any tracked device battery is low"
    trigger:
      - platform: numeric_state
        entity_id:
          - sensor.my_tracker_battery
          - sensor.my_phone_battery
        below: 20
    action:
      - service: notify.mobile_app
        data:
          title: "Low Battery Alert"
          message: >
            {{ trigger.to_state.attributes.friendly_name }} 
            battery is at {{ states(trigger.entity_id) }}%
          data:
            priority: high
            tag: low_battery

  # Device arrived home
  - alias: "Google Find My - Device Arrived Home"
    description: "Notify when a tracked device arrives home"
    trigger:
      - platform: zone
        entity_id:
          - device_tracker.my_tracker
        zone: zone.home
        event: enter
    action:
      - service: notify.mobile_app
        data:
          title: "Device Home"
          message: "{{ trigger.to_state.attributes.friendly_name }} has arrived home"

  # Device left home
  - alias: "Google Find My - Device Left Home"
    description: "Notify when a tracked device leaves home"
    trigger:
      - platform: zone
        entity_id:
          - device_tracker.my_tracker
        zone: zone.home
        event: leave
    action:
      - service: notify.mobile_app
        data:
          title: "Device Left"
          message: "{{ trigger.to_state.attributes.friendly_name }} has left home"

  # Device not seen for a while
  - alias: "Google Find My - Device Not Seen Alert"
    description: "Alert if device hasn't been seen for 24 hours"
    trigger:
      - platform: template
        value_template: >
          {{ (now() - states.sensor.my_tracker_last_seen.last_changed).total_seconds() > 86400 }}
    action:
      - service: notify.mobile_app
        data:
          title: "Device Not Seen"
          message: >
            {{ trigger.entity_id.split('.')[1].replace('_last_seen', '').replace('_', ' ').title() }}
            hasn't been seen for over 24 hours

  # Critical battery level
  - alias: "Google Find My - Critical Battery"
    description: "Urgent alert when battery is critically low"
    trigger:
      - platform: numeric_state
        entity_id:
          - sensor.my_tracker_battery
        below: 10
    action:
      - service: notify.mobile_app
        data:
          title: "⚠️ Critical Battery"
          message: >
            {{ trigger.to_state.attributes.friendly_name }} 
            battery is critically low at {{ states(trigger.entity_id) }}%!
          data:
            priority: high
            tag: critical_battery
            color: red

# ============================================================================
# SCRIPTS
# ============================================================================

script:
  # Get all device locations
  get_device_locations:
    alias: "Get All Device Locations"
    description: "Log the current location of all tracked devices"
    sequence:
      - service: logbook.log
        data:
          name: "Device Locations"
          message: >
            {% for state in states.device_tracker %}
              {% if 'google_findmy' in state.entity_id %}
                {{ state.attributes.friendly_name }}: 
                {{ state.attributes.latitude }}, {{ state.attributes.longitude }}
                (Accuracy: {{ state.attributes.accuracy }}m)
              {% endif %}
            {% endfor %}

  # Check device battery levels
  check_battery_levels:
    alias: "Check All Battery Levels"
    description: "Send notification with all device battery levels"
    sequence:
      - service: notify.mobile_app
        data:
          title: "Device Battery Levels"
          message: >
            {% for state in states.sensor %}
              {% if state.entity_id.endswith('_battery') and 'google_findmy' in state.entity_id %}
                {{ state.attributes.friendly_name }}: {{ state.state }}%
              {% endif %}
            {% endfor %}

# ============================================================================
# TEMPLATE SENSORS (Optional - for additional functionality)
# ============================================================================

template:
  - sensor:
      # Distance from home
      - name: "My Tracker Distance from Home"
        unique_id: my_tracker_distance_from_home
        unit_of_measurement: "km"
        state: >
          {% set tracker = states.device_tracker.my_tracker %}
          {% if tracker and tracker.attributes.latitude and tracker.attributes.longitude %}
            {{ distance(tracker.entity_id, zone.home) | round(2) }}
          {% else %}
            unavailable
          {% endif %}
        icon: mdi:map-marker-distance

      # Battery status text
      - name: "My Tracker Battery Status"
        unique_id: my_tracker_battery_status
        state: >
          {% set battery = states('sensor.my_tracker_battery') | int(0) %}
          {% if battery > 80 %}
            Excellent
          {% elif battery > 50 %}
            Good
          {% elif battery > 20 %}
            Low
          {% elif battery > 10 %}
            Very Low
          {% else %}
            Critical
          {% endif %}
        icon: >
          {% set battery = states('sensor.my_tracker_battery') | int(0) %}
          {% if battery > 80 %}
            mdi:battery
          {% elif battery > 50 %}
            mdi:battery-60
          {% elif battery > 20 %}
            mdi:battery-30
          {% elif battery > 10 %}
            mdi:battery-10
          {% else %}
            mdi:battery-alert
          {% endif %}

  - binary_sensor:
      # Is device home
      - name: "My Tracker Is Home"
        unique_id: my_tracker_is_home
        state: >
          {{ is_state('device_tracker.my_tracker', 'home') }}
        device_class: presence
        icon: mdi:home

